<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Language</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="language-page">
  <div class="card fade-in">
    <h1 id="title">Choose Your Language</h1>
    <p id="description">Select the language you are comfortable with.</p>
    <div class="lang-buttons">
      <button class="lang-btn" onclick="setLanguage('en')">English</button>
      <button class="lang-btn" onclick="setLanguage('hi')">हिंदी</button>
      <button class="lang-btn" onclick="setLanguage('mal')">മലയാളം</button>
      <button class="lang-btn" onclick="setLanguage('tam')">தமிழ்</button>
      <button class="lang-btn" onclick="setLanguage('tel')">తెలుగు</button>
      <button class="lang-btn" onclick="setLanguage('kan')">ಕನ್ನಡ</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
